<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Better GeeTest Playground</title>
  </head>
  <body>
    <main>
      <h1>Better GeeTest Playground</h1>
      <form id="auth-form">
        <input id="name" name="name" placeholder="昵称" required />
        <input id="email" name="email" type="email" placeholder="邮箱" required />
        <input id="password" name="password" type="password" placeholder="密码（至少 8 位）" required minlength="8" />
        <button id="verify" type="submit">验证并注册</button>
      </form>
      <button id="sign-out" type="button" hidden>退出登录</button>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
