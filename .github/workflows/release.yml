name: Release

on:
  push:
    tags: ['*_v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .tool-versions

      - run: bun ci
      - run: |
          PKG_NAME=$(echo "$TAG" | sed 's/_v.*//')
          cd packages/$PKG_NAME
          bun run build
          pnpm publish
        env:
          TAG: ${{ github.ref_name }}
